<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Security Checker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: rgba(30, 41, 59, 0.9);
      padding: 40px;
      border-radius: 16px;
      width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    p {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      margin-bottom: 15px;
      font-size: 14px;
      background: #0f172a;
      color: white;
      outline: none;
    }

    input:focus {
      border: 1px solid #3b82f6;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #2563eb;
    }

    .result {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }

    .safe {
      background: rgba(34,197,94,0.15);
      color: #22c55e;
    }

    .danger {
      background: rgba(239,68,68,0.15);
      color: #ef4444;
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #64748b;
    }

  </style>
</head>
<body>

<div class="container">
  <h1>🔐 Password Security Checker</h1>
  <p>Check if your password has been exposed in data breaches</p>

  <input type="password" id="password" placeholder="Enter your password">
  <button onclick="checkPassword()">Analyze Password</button>

  <div id="result" class="result"></div>

  <div class="footer">Secure hashing • Privacy-first • No password stored</div>
</div>

<script>
async function sha1(str) {
  const buffer = new TextEncoder().encode(str);
  const hash = await crypto.subtle.digest('SHA-1', buffer);
  return Array.from(new Uint8Array(hash))
    .map(b => b.toString(16).padStart(2, '0'))
    .join('')
    .toUpperCase();
}

async function checkPassword() {
  const password = document.getElementById('password').value;
  const resultDiv = document.getElementById('result');

  if (!password) {
    resultDiv.style.display = 'block';
    resultDiv.className = 'result danger';
    resultDiv.innerText = 'Please enter a password';
    return;
  }

  resultDiv.style.display = 'block';
  resultDiv.className = 'result';
  resultDiv.innerText = 'Checking...';

  const hash = await sha1(password);
  const prefix = hash.substring(0,5);
  const suffix = hash.substring(5);

  const res = await fetch(`https://api.pwnedpasswords.com/range/${prefix}`);
  const text = await res.text();

  const found = text.split('\n').find(line => line.startsWith(suffix));

  if (found) {
    const count = found.split(':')[1];
    resultDiv.className = 'result danger';
    resultDiv.innerText = `⚠️ Found in ${count} breaches. Change immediately.`;
  } else {
    resultDiv.className = 'result safe';
    resultDiv.innerText = '✅ No breaches found. Still use a strong password.';
  }
}
</script>

</body>
</html>
